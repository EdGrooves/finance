services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-EdGrooves/finance}:latest
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/app/data/finance.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    restart: unless-stopped
